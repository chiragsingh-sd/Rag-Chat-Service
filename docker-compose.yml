services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-rag-chat-service}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/rag_chat
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      SECRET_KEY: ${SECRET_KEY:-development-only-secret-key-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
